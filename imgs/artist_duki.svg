    <!-- Tatuajes faciales característicos (alas bajo los ojos) -->
    <path d="M 130 145 Q 145 140 155 148 M 130 155 Q 145 150 155 158" stroke="#141635" stroke-width="2.5" fill="none"/>
    <path d="M 230 145 Q 215 140 205 148 M 230 155 Q 215 150 205 158" stroke="#141635" stroke-width="2.5" fill="none"/>
    
    <!-- Mirada desafiante -->
    <path d="M 145 130 Q 160 120 170 128 M 190 128 Q 200 120 215 130" stroke="#141635" stroke-width="4" fill="none"/>
    <ellipse cx="160" cy="138" rx="5" ry="5" fill="#141635"/>
    <ellipse cx="202" cy="138" rx="5" ry="5" fill="#141635"/>
    
    <!-- Nariz y boca -->
    <path d="M 182 135 L 184 170 L 176 176 H 188" stroke="#141635" stroke-width="3" fill="none"/>
    <path d="M 170 195 Q 182 200 194 195" stroke="#141635" stroke-width="4" stroke-linecap="round" fill="none"/>
