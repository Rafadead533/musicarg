  </defs>
  <rect width="350" height="400" fill="url(#dukiGrad)"/>
  
  <g fill="#1a1c4b">
    <!-- Hombros y torso -->
    <path d="M 40 400 L 90 280 L 160 300 L 200 300 L 270 280 L 320 400 Z"/>
    
