      <stop offset="0%" stop-color="#f24e1e"/>
      <stop offset="100%" stop-color="#bd350a"/>
    </linearGradient>
  </defs>
  <rect width="350" height="400" fill="url(#joaquiGrad)"/>
  
  <g fill="#1a1c4b">
