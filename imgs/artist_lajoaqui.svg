    <!-- Delineado alargado -->
    <path d="M 173 174 L 180 170 M 211 174 L 218 170" stroke="#141635" stroke-width="2"/>
    
    <!-- Labios voluptuosos -->
    <path d="M 175 205 Q 188 200 200 205 Q 188 215 175 205 Z" fill="#141635"/>
    
