<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gardelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191c4d"/>
      <stop offset="100%" stop-color="#12143a"/>
    </linearGradient>
  </defs>
  <!-- Fondo Azul Noche Duotono (según la maqueta) -->
  <rect width="400" height="500" fill="url(#gardelBlue)"/>

  <!-- Carlos Gardel en serigrafía blanca / alto contraste -->
  <g fill="#ffffff">
    <!-- Sombrero Fedora Tanguero de ala -->
    <!-- Copa del sombrero -->
    <path d="M 120 180 C 130 90, 200 70, 270 95 C 310 110, 320 150, 310 180 Z"/>
    <!-- Cinta del sombrero -->
    <path d="M 115 180 Q 215 170 315 180 L 318 195 Q 215 185 112 195 Z" fill="#12143a"/>
    <!-- Ala del sombrero elegante inclinada -->
    <path d="M 60 190 Q 215 140 370 200 Q 220 190 60 190 Z"/>

    <!-- Rostro sonriente y rasgos -->
    <!-- Frente, mejillas y mentón -->
    <path d="M 150 200 Q 220 205 275 200 C 290 240, 290 280, 260 315 C 235 340, 190 340, 165 315 C 145 285, 140 240, 150 200 Z"/>
    
    <!-- Ojos y cejas (recortes en azul de fondo) -->
    <path d="M 175 235 Q 195 230 210 240 M 240 240 Q 255 230 270 235" stroke="#191c4d" stroke-width="4" stroke-linecap="round" fill="none"/>
    <ellipse cx="195" cy="248" rx="6" ry="7" fill="#191c4d"/>
    <ellipse cx="255" cy="248" rx="6" ry="7" fill="#191c4d"/>
    
    <!-- Nariz refinada -->
    <path d="M 225 240 L 230 275 L 220 280 M 235 280 L 220 280" stroke="#191c4d" stroke-width="3" fill="none"/>

    <!-- Sonrisa gardeliana inconfundible -->
    <path d="M 190 295 Q 225 315 260 295 Q 225 325 190 295 Z" fill="#191c4d"/>
    <path d="M 195 298 Q 225 312 255 298" stroke="#ffffff" stroke-width="3" fill="none"/>

    <!-- Cuello de camisa y corbata -->
    <path d="M 185 340 L 225 375 L 265 340 L 255 330 L 195 330 Z"/>
    <path d="M 215 370 L 235 370 L 230 460 L 220 460 Z" fill="#12143a"/>

    <!-- Traje elegante solapas y hombros -->
    <path d="M 50 500 L 120 370 L 190 380 L 170 500 Z"/>
    <path d="M 350 500 L 280 370 L 210 380 L 230 500 Z"/>
  </g>
</svg>
