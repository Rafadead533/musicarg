<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <defs>
    <linearGradient id="urbanoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141740"/>
      <stop offset="50%" stop-color="#1b1f54"/>
      <stop offset="100%" stop-color="#d6441a"/>
    </linearGradient>
  </defs>
  <rect width="700" height="280" fill="url(#urbanoGrad)"/>
  
  <!-- Multitud y luces de escenario en silueta y duotono -->
  <g fill="#0e102e">
    <!-- Luces y haces -->
    <polygon points="100,0 180,280 60,280" fill="#f24e1e" opacity="0.25"/>
    <polygon points="350,0 450,280 300,280" fill="#f24e1e" opacity="0.35"/>
    <polygon points="600,0 680,280 540,280" fill="#f24e1e" opacity="0.2"/>
    
    <!-- Silueta multitud con brazos en alto -->
    <path d="M 0 280 L 0 200 Q 30 180 50 210 Q 80 160 110 220 Q 140 170 170 210 Q 200 150 230 200 Q 260 180 290 220 Q 320 140 350 190 Q 380 170 410 210 Q 440 130 470 190 Q 500 180 530 220 Q 560 160 590 200 Q 620 180 650 210 Q 680 150 700 200 L 700 280 Z"/>
    
    <!-- Manos y teléfonos arriba -->
    <circle cx="110" cy="150" r="10"/>
    <circle cx="230" cy="140" r="12"/>
    <circle cx="320" cy="130" r="11"/>
    <circle cx="470" cy="120" r="13"/>
    <circle cx="590" cy="150" r="10"/>
    <circle cx="680" cy="140" r="11"/>
    
    <!-- Teléfonos brillando -->
    <circle cx="230" cy="140" r="4" fill="#ffffff"/>
    <circle cx="470" cy="120" r="4" fill="#ffffff"/>
    <circle cx="680" cy="140" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Insignia circular "PL" en la esquina inferior derecha -->
  <circle cx="645" cy="235" r="24" fill="#f24e1e" stroke="#ffffff" stroke-width="2"/>
  <text x="645" y="243" fill="#ffffff" font-family="'Bebas Neue', sans-serif" font-size="20" font-weight="bold" text-anchor="middle">PL</text>
</svg>
