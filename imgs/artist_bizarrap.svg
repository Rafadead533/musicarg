<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bizaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f24e1e"/>
      <stop offset="100%" stop-color="#ab2d05"/>
    </linearGradient>
  </defs>
  <rect width="350" height="400" fill="url(#bizaGrad)"/>
  
  <g fill="#1a1c4b">
    <!-- Chaqueta y postura con celular/auricular -->
    <path d="M 40 400 L 90 280 L 160 300 L 200 300 L 270 280 L 320 400 Z"/>
    
    <!-- Mano sosteniendo celular en la oreja -->
    <path d="M 100 240 Q 110 180 135 170 L 145 220 Z"/>
    <rect x="120" y="160" width="18" height="50" rx="4" transform="rotate(-15 120 160)" fill="#141635"/>
    
    <!-- Cuello y Rostro -->
    <path d="M 140 280 L 140 200 Q 140 130 185 130 Q 230 130 230 200 L 230 280 Z" fill="#f24e1e"/>
    
    <!-- Gorra visera hacia adelante -->
    <!-- Copa de la gorra -->
    <path d="M 130 140 C 130 65, 185 55, 235 65 C 240 100, 240 130, 240 140 Z" fill="#141635"/>
    <!-- Logo "BZRP" mínimo en la gorra -->
    <text x="185" y="105" fill="#f24e1e" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">BZRP</text>
    <!-- Visera curva horizontal -->
    <path d="M 110 135 Q 185 120 260 135 Q 185 155 110 135 Z" fill="#141635"/>
    
    <!-- Lentes de sol rectangulares negros característicos -->
    <rect x="140" y="148" width="40" height="24" rx="3" fill="#141635"/>
    <rect x="190" y="148" width="40" height="24" rx="3" fill="#141635"/>
    <rect x="180" y="156" width="10" height="4" fill="#141635"/>
    <!-- Brillo en los cristales -->
    <path d="M 145 152 L 160 168 M 195 152 L 210 168" stroke="#f24e1e" stroke-width="2"/>
    
    <!-- Barba candado sutil / labios -->
    <path d="M 175 210 Q 185 215 195 210" stroke="#141635" stroke-width="3" fill="none"/>
  </g>
</svg>
